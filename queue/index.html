<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue Visualizer</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#1d2433; --muted:#5d6779; --line:#c9d1de;
  --orange:#ff9a2e; --orange-ink:#1d2433; --dim:#e6eaf1; --found:#2e9e6a; --arrow:#2447d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a26; --surface:#1c2434; --ink:#eaeef6; --muted:#9aa5ba; --line:#37425a;
    --orange:#ff9a2e; --orange-ink:#1a1204; --dim:#252f44; --found:#43c78c; --arrow:#7da0ff;
  }
}
:root[data-theme="dark"]{
  --bg:#141a26; --surface:#1c2434; --ink:#eaeef6; --muted:#9aa5ba; --line:#37425a;
  --orange:#ff9a2e; --orange-ink:#1a1204; --dim:#252f44; --found:#43c78c; --arrow:#7da0ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:26px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input{font:inherit;font-size:1.1rem;width:120px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.secondary{background:transparent;color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--arrow);outline-offset:2px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 14px 20px;overflow-x:auto}
.box{height:56px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;background:var(--dim);color:var(--muted);transition:background .25s,color .25s,border-color .25s}
.box.on{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.box.peek{border-color:var(--arrow);box-shadow:0 0 0 3px var(--arrow)}
.idx{font-size:.75rem;color:var(--muted)}
.tag{color:var(--arrow);font-weight:700;font-size:.8rem}
.info{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.8rem;color:var(--muted)}
#msg{margin-top:18px;padding:14px 16px;border-left:5px solid var(--orange);background:var(--surface);border-radius:6px;font-size:1.05rem;min-height:3.2em}
#msg.ok{border-color:var(--found)} #msg.no{border-color:#d6453d}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
footer{text-align:center;color:var(--muted);padding:0 0 28px}
.row{display:flex;gap:6px;min-width:max-content;margin:0 auto;width:max-content}
.cell{width:56px;flex:none;display:flex;flex-direction:column;align-items:center}
.cell .tag{height:24px;visibility:hidden}
.cell.front .tag.f,.cell.rear .tag.r{visibility:visible}
.cell .box{width:100%}
.cell .idx{margin:6px 0 2px}
</style>
</head>
<body>
<main>
  <h1>Queue visualizer</h1>
  <p class="sub">A queue is first in, first out. Enqueue adds a value at the rear, and dequeue removes the value at the front.</p>

  <div class="controls">
    <label>Value
      <input id="val" type="number" step="1" inputmode="numeric" placeholder="e.g. 7">
    </label>
    <button id="enq">Enqueue</button>
    <button id="deq">Dequeue</button>
    <button id="reset" class="secondary">Reset</button>
  </div>

  <div class="stage"><div class="row" id="row" role="list" aria-label="Queue, front on the left"></div></div>

  <div class="legend">
    <span><i style="background:var(--orange)"></i>Item in the queue</span>
    <span><i style="background:var(--dim);border:1px solid var(--line)"></i>Empty slot</span>
  </div>

  <div class="info">
    <div class="stat"><b id="sSize">0</b><span>size</span></div>
    <div class="stat"><b id="sFront">–</b><span>front value</span></div>
    <div class="stat"><b id="sRear">–</b><span>rear value</span></div>
    <div class="stat"><b id="sCap">10</b><span>capacity</span></div>
  </div>

  <div id="msg" role="status" aria-live="polite"></div>
</main>
<footer>&copy; 2026 Jack Kwok. All rights reserved.</footer>

<script>
const CAP = 10;
let items;
const $ = id => document.getElementById(id);

function render(){
  const r = $('row'); r.innerHTML = '';
  for(let i=0;i<CAP;i++){
    const filled = i < items.length;
    const c = document.createElement('div');
    c.className = 'cell'+(filled&&i===0?' front':'')+(filled&&i===items.length-1?' rear':'');
    c.setAttribute('role','listitem');
    c.innerHTML = '<span class="tag f">front &darr;</span><div class="box'+(filled?' on':'')+'">'+(filled?items[i]:'')+'</div><div class="idx">'+i+'</div><span class="tag r">&uarr; rear</span>';
    r.appendChild(c);
  }
  $('sSize').textContent = items.length;
  $('sFront').textContent = items.length ? items[0] : '–';
  $('sRear').textContent = items.length ? items[items.length-1] : '–';
  $('enq').disabled = items.length >= CAP;
  $('deq').disabled = items.length === 0;
}
function say(t,c){ const m=$('msg'); m.textContent=t; m.className=c||''; }

function enqueue(){
  const raw = $('val').value.trim();
  if(raw === '' || !Number.isInteger(Number(raw))){ say('Enter a whole number to enqueue.'); $('val').focus(); return; }
  if(items.length >= CAP){ say('Queue overflow: the queue is full (capacity '+CAP+'). Dequeue a value first.','no'); return; }
  items.push(Number(raw));
  render(); say('Enqueued '+raw+' at the rear (position '+(items.length-1)+').');
  $('val').value = ''; $('val').focus();
}
function dequeue(){
  if(!items.length){ say('Queue underflow: the queue is empty, nothing to dequeue.','no'); return; }
  const v = items.shift();
  render(); say('Dequeued '+v+' from the front. '+(items.length ? 'The new front is '+items[0]+'.' : 'The queue is now empty.'),'ok');
}
function reset(){
  items = []; $('val').value = '';
  render(); say('The queue is empty. Enter a whole number and press Enqueue.');
}

$('enq').addEventListener('click', enqueue);
$('deq').addEventListener('click', dequeue);
$('reset').addEventListener('click', reset);
$('val').addEventListener('keydown', e=>{ if(e.key==='Enter') enqueue(); });
reset();
</script>
</body>
</html>
